name: ci

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  syntax:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile all
        run: python -m compileall -q doclib tests run.py
      - name: Import package
        run: python -c "import doclib; print('doclib import ok')"
