name: CI

on:
  push:
    branches: ["main"]
  pull_request: {}
  workflow_dispatch: {}

concurrency:
  group: "ci-${{ github.ref }}"
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      PYTHONUTF8: "1"
      DOCLIB_DATA: "${{ github.workspace }}\\.ci-data"
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Prepare empty data dir
        run: |
          New-Item -ItemType Directory -Force -Path "$env:DOCLIB_DATA" | Out-Null
      - name: Core regression
        run: |
          python tests/smoke.py
          python tests/test_notes.py
          python tests/test_scope_isolation.py
          python tests/test_partitions.py
          python tests/test_citations.py
          python tests/test_mindmap_gen.py
      - name: v2 graph / reader / notes
        run: |
          python tests/test_graph.py
          python tests/test_reader.py
          python tests/test_notebook.py
      - name: v2 context / migrations / workspace / HTTP
        run: |
          python tests/test_context.py
          python tests/test_migrations_v2.py
          python tests/test_workspace.py
          python tests/test_http_v2.py
