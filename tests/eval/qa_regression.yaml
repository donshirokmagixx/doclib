# 问答检索回归集（只验证「关键块是否进前 N」，不调模型、不花 token）
# 规则：预期内容在 heading_path + 正文里出现任意一个 expect_any 即算通过
# top: 允许的召回块数（默认 8，与问答一致）
# known_fail: true 表示当前已知未达标，仅作跟踪，不计入失败

cases:
  - id: qa01
    q: 正弦信号的傅里叶变换
    expect_any: ["sinω0t", "常用信号的傅里叶变换对", "必备变换对"]

  - id: qa02
    q: 冲激函数的傅里叶级数展开
    expect_any: ["周期信号的傅里叶变换", "典型信号三种变换结果对照"]

  - id: qa03
    q: 冲激信号与一般信号的卷积
    expect_any: ["冲激信号的运算性质", "卷积是什么"]

  - id: qa04
    q: 卷积定理是怎么说的？
    expect_any: ["卷积定理"]

  - id: qa05
    q: u(t-t0) 的单边拉普拉斯变换是什么
    expect_any: ["拉普拉斯变换的性质", "常用信号的拉普拉斯变换对", "4.4"]

  - id: qa06
    q: 傅里叶级数与傅里叶变换有什么区别
    expect_any: ["傅里叶级数"]

  - id: qa07
    q: 时域频域转换
    expect_any: ["傅里叶变换的性质", "时域与频域的对应关系"]

  - id: qa08
    q: 帕塞瓦尔定理是什么
    expect_any: ["帕塞瓦尔", "Parseval"]

  - id: qa09
    q: 抽样定理和奈奎斯特频率什么关系
    expect_any: ["抽样定理"]

  - id: qa10
    q: 为什么采样不够会混叠
    expect_any: ["抽样", "混叠"]

  - id: qa11
    q: 单位冲激信号的导数是什么信号，有什么用
    expect_any: ["冲激偶"]     # 只认「冲激偶」章节，不接受泛匹配（防止测试放水）

  - id: qa12
    q: 对于复合信号的傅里叶变换和拉普拉斯变换应该怎样求解
    expect_any: ["拉普拉斯变换", "与傅里叶变换的关系"]

  # ==== 用户真实提问（2026-11-13 截图中暴露的问题，逐条锁死）====
  - id: qa13
    q: 对于两个起始t不同的信号卷积，结果的取值范围是什么呢
    expect_any: ["时移、尺度与对称性", "支撑区间"]

  - id: qa14
    q: 系统因果性本质是什么
    expect_any: ["因果系统与非因果系统"]

  - id: qa15
    q: 在拉普拉斯与傅里叶变换的转换过程中，为什么收敛域包含虚轴就可以直接用s替换jΩ
    expect_any: ["收敛域（ROC）", "与傅里叶变换的关系"]

  - id: qa16
    q: 矩形脉冲限号的傅里叶级数
    # 「周期矩形脉冲」才是这一问的正解；2.6 常见周期信号也可接受
    expect_any: ["周期矩形脉冲", "常见周期信号的傅里叶级数"]

  - id: qa17
    q: 单边指数信号存不存在左边信号
    expect_any: ["直流信号与指数信号"]

  - id: qa18
    q: 符号函数的傅里叶级数
    expect_any: ["阶跃信号与符号函数"]

  - id: qa19
    q: 傅里叶变换的基本性质
    expect_any: ["傅里叶变换的性质"]

  - id: qa20
    q: 信号时域表达式共轭对于频域表达式有什么影响
    expect_any: ["傅里叶级数的性质", "傅里叶变换的性质"]

  - id: qa21
    q: 时域信号自变量的正负改变对于频域信号有什么影响
    expect_any: ["自变量变换", "傅里叶级数的性质"]
